# Publishes to RubyGems when a GitHub Release is published, matching how dregs-mcp releases.
#
# Authentication is RubyGems Trusted Publishing: RubyGems is configured to trust this repository
# and this workflow file over OIDC, so there is no API key in repository secrets. Configure the
# publisher at https://rubygems.org/gems/dregs/trusted_publishers with:
#
#   owner: dregs-sdk    repository: dregs-sdk-ruby    workflow: publish.yml    environment: rubygems
#
# The `rubygems` environment is the approval gate: a release cannot reach RubyGems without whoever
# is named as its reviewer signing off.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUNDLE_FROZEN: "true"

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # A tag that disagrees with the packaged version would publish something other than what the
      # release notes describe, and a version cannot be reused on RubyGems once it is taken.
      - name: Check that the release tag matches the gem version
        if: github.event_name == 'release'
        run: |
          version=$(ruby -Ilib -e 'require "dregs/version"; print Dregs::VERSION')
          tag="${GITHUB_REF_NAME#v}"
          echo "lib/dregs/version.rb=$version tag=$tag"
          test "$version" = "$tag"

      - name: RSpec
        run: bundle exec rspec

      - name: Build
        run: gem build dregs.gemspec

      - name: Upload the gem
        uses: actions/upload-artifact@v4
        with:
          name: gem
          path: "*.gem"

  publish:
    name: Publish to RubyGems
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: https://rubygems.org/gems/dregs
    permissions:
      id-token: write  # required for Trusted Publishing; nothing else needs a token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Download the gem
        uses: actions/download-artifact@v4
        with:
          name: gem

      # Exchanges this job's OIDC token for a RubyGems credential that lives for the length of the
      # job. `rubygems/release-gem` would also work, but it runs `rake release`, which wants to cut
      # the git tag itself; the tag already exists by the time a release event fires.
      - name: Authenticate to RubyGems
        uses: rubygems/configure-rubygems-credentials@v1

      - name: Publish
        run: gem push dregs-*.gem
