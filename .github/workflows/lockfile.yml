# Temporary: resolves Gemfile.lock so it can be committed. Removed once the lock is in the repo.
name: Lockfile

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Resolve the lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Resolve
        run: bundle lock --add-platform ruby arm64-darwin x86_64-darwin x86_64-linux aarch64-linux

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: Gemfile.lock
