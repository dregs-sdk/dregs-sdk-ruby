# Lint, validate the signatures, and test. Bundler installs from the committed Gemfile.lock in
# frozen mode, so a lock that no longer agrees with the Gemfile fails the build here rather than
# quietly resolving something else.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_FROZEN: "true"

jobs:
  lint:
    name: Lint and validate signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop

      - name: RBS
        run: bundle exec rbs -I sig validate --silent

  test:
    name: Test on Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: RSpec
        run: bundle exec rspec

  build:
    name: Build the gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build
        run: gem build dregs.gemspec

      # Catches a gemspec that builds but ships the wrong files, which is otherwise only
      # discovered by whoever installs the published gem.
      - name: Check what the gem contains
        run: |
          gem unpack dregs-*.gem --target unpacked
          test -f unpacked/dregs-*/lib/dregs.rb
          test -f unpacked/dregs-*/lib/dregs/client.rb
          test -f unpacked/dregs-*/lib/dregs/webhooks.rb
          test -f unpacked/dregs-*/README.md
          test -f unpacked/dregs-*/LICENSE
          test ! -e unpacked/dregs-*/spec

      - name: Install it and load it
        run: |
          gem install --local dregs-*.gem
          ruby -e 'require "dregs"; puts Dregs::VERSION'

      - name: Upload the gem
        uses: actions/upload-artifact@v4
        with:
          name: gem
          path: "*.gem"
          retention-days: 7
